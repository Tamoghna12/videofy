voiceover:
  speed: 0.92
  text: >-
    As dusk settles over Yorkshire, Bradford transforms beneath the evening sky. |
    At the heart of the city lies Centenary Square, centered around the 220-foot clock tower of City Hall. |
    Modeled on the Palazzo Vecchio of Florence, its Venetian gothic arches glow in warm amber light. |
    Across the mirror pool, mist fountains rise and fall as twilight envelopes the piazza. |
    When night finally falls, the city reveals its most poetic and serene hour.

