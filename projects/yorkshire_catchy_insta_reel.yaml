outro_title: "EXPLORE YORKSHIRE"
outro_subtitle: "Save this for your road trip 📍"
handle: "@yorkshire.travels"

footage_dir: "."
output_file: "edit/reels_9x16/catchy_insta_reel_9x16.mp4"
