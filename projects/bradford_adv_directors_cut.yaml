voiceover:
  speed: 0.92
  text: >-
    Travelling across Yorkshire by rail, there is a quiet anticipation as the tracks weave towards Bradford Interchange. |
    Stepping out beneath the massive Victorian railway viaducts, you feel the industrial pulse that shaped northern England. |
    In Little Germany, monumental stone warehouses and narrow streets stand just as they did over a century ago. |
    Taking time to rest and observe the city from above, watching life move through the urban landscape. |
    As evening falls, Centenary Square comes alive with glowing fountains and the timeless silhouette of City Hall. |
    A journey through history, architecture, and enduring Yorkshire character. Until next time.

