voiceover:
  speed: 0.91
  text: >-
    There is a quiet clarity in the morning air when you start walking towards campus, with the autumn sunlight filtering through the trees. |
    Passing down Epinal Way, you are greeted by Loughborough University. A campus renowned worldwide for innovation, sporting excellence, and drive. |
    Beyond the vibrant bustle of the Students' Union, the historic Hazlerigg Building stands proudly, framing the central fountain quadrangle. |
    There is an incredible sense of openness across these sprawling lawns. Room to breathe, room to think, and space to find your path. |
    Boarding the campus Sprint shuttle, watching the endless sports pitches drift by. In these quiet moments of commute, clarity always finds you. |
    Stepping back out into the academic precinct, ready for what lies ahead. Another day, another chapter written. Until next time.

