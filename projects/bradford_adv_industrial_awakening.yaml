voiceover:
  speed: 0.92
  text: >-
    Stepping off the train into Bradford, you immediately sense the weight of centuries. |
    Rising from the valleys of West Yorkshire, this city grew from a quiet wool trading town into the textile capital of the world. |
    Look closely at the magnificent Victorian sandstone, carved with gothic spires and towering arches that carried the industrial revolution forward. |
    Through every alleyway and stone facade in Little Germany, the echoes of Victorian merchants and master craftspeople still linger. |
    An enduring testament to grit, architectural grandeur, and Yorkshire heritage.

