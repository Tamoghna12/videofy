name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg & fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint and syntax validation
        run: |
          python -m py_compile render_template.py
          python -m py_compile $(find video_templates -name "*.py")
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run test suite
        run: |
          python3 render_template.py --list-presets
          python3 render_template.py --list-luts
          python3 render_template.py --info
